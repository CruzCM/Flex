.main .integrated-tech-row .key{font-size:13px;line-height:1.35;font-weight:600;color:var(--text-secondary);margin-bottom:2px}
.main .integrated-tech-row code{font-size:.96em;font-weight:550;color:var(--text-heading)}
.main .formula span,.main .equations span,.main .time span,.main .outcomes span,.main .outcomes small,.main .scale small{font-size:13px;line-height:1.35;color:var(--text-secondary)}
.main .formula b,.main .formula code,.main .equations b,.main .inline-values,.main .inline-values span{font-size:16px;line-height:1.4;font-weight:600;letter-spacing:0;color:var(--text-heading)}

}
@media(max-width:760px){

}

</style></head><body><main id="app"><header class="top"><h1>Radar Financeiro · Regras de negócio</h1></header><nav class="macro" aria-label="Etapas do Radar"><div class="phase p1">1 · Qualificação e contexto</div><div class="phase p2">2 · Seleção e reconciliação</div><div class="phase p3">3 · Inteligência e ação</div></nav><div class="mobile-nav"><label>Etapa<select id="mobile-stage" aria-label="Etapa"></select></label><label>Regra<select id="mobile-rule" aria-label="Regra"></select></label></div><section class="workspace"><aside class="sidebar"><div class="side-caption" id="side-caption">Regras da etapa</div><nav class="rule-list" id="rule-list" aria-label="Regras da etapa"></nav></aside><section class="main"><div class="main-top"><div class="context" id="context"></div></div><div class="viewport" id="viewport" aria-live="polite"></div><div class="page-controls" id="page-controls"></div></section><aside class="schema-panel" id="schema-panel" aria-label="Tabela principal">
<div class="schema-header"><div><h2>Tabela principal</h2><div class="schema-count" id="field-count"></div></div></div>
<div class="schema-progress" aria-hidden="true"><span id="meter"></span></div>
<div class="schema-toolbar"><span>Uma linha por MCI</span><button type="button" id="schema-scope" aria-pressed="false">Ver todos</button></div>

<div class="schema-pager" id="schema-pager" hidden></div>

</aside></section><footer class="footer"><nav class="stepper" aria-label="Navegação sequencial"><button id="previous" type="button">← Anterior</button><span id="position"></span><button id="next" type="button">Próxima →</button></nav></footer></main><script>
const DATA={"stages": [{"name": "Entrada do MCI", "question": "Quem tem dados para análise?", "rules": [0, 1, 2, 3]}, {"name": "Identificação e contexto", "question": "Qual conta, renda e perfil usar?", "rules": [4, 5, 6, 7, 8]}, {"name": "Período de análise", "question": "Qual ciclo já fechou?", "rules": [9, 10]}, {"name": "Seleção de transações", "question": "Que movimentos entram no cálculo?", "rules": [11, 12, 13, 14]}, {"name": "Organização e diagnóstico", "question": "O que os movimentos mostram?", "rules": [15, 16, 17]}, {"name": "Priorização", "question": "Qual tema orientar primeiro?", "rules": [18]}], "rules": [{"id": "regra-1-0", "name": "Sincronização recente", "kind": "Elegibilidade", "round": "sync", "source": "Leitura de transações recentes", "title": "Sincronização recente é condição de entrada.", "body": "<p class=\"lead\">Para entrar no Radar, o cliente deve ter sincronizado no Minhas Finanças (Meus Gastos) pelo menos uma vez entre o primeiro dia do mês anterior e a véspera da execução.<\/p><div class=\"timeline\"><div class=\"time muted\"><b>30/09<\/b><span>Fora da janela<\/span><\/div><div class=\"time active-time\"><b>01/10 — 25/11<\/b><span>Janela elegível · sincronização em 26/10<\/span><\/div><div class=\"time muted\"><b>26/11<\/b><span>Execução · excluída<\/span><\/div><\/div><p class=\"annotation\"><b>26/10:<\/b> segue na análise. <b>30/09:<\/b> fica fora nesta execução.<\/p>", "tech": [["Fonte", "<code>DB2GFP.TRAN_RLZD_INST_PCT<\/code>"], ["Condição", "<code>1º dia do mês anterior a DT_EXEA ≤ TS_INCL_TRAN &lt; DT_EXEA<\/code>"]], "notes": [], "explanation": ["O Radar verifica se há pelo menos uma transação elegível incluída desde o primeiro dia do mês anterior à execução até a véspera.", "Com inclusão na janela, o MCI segue para as demais regras. Sem inclusão na janela, fica fora da análise nesta execução."], "stage": 0}, {"id": "regra-1-1", "name": "Última inclusão por MCI", "kind": "Enriquecimento", "round": "sync", "source": "Leitura de transações recentes", "title": "O Radar guarda a última inclusão de cada MCI.", "body": "<p class=\"lead\">Na mesma leitura da janela de sincronização, agrupa os registros por MCI e seleciona a maior data e hora de inclusão.<\/p><div class=\"formula\"><span>Última inclusão<\/span><code>MAX(TS_INCL_TRAN)<\/code><\/div><p class=\"annotation\">Essa referência permite identificar qual ciclo financeiro já estava fechado.<\/p>", "tech": [["Agrupamento", "<code>CD_CLI<\/code>"], ["Cálculo", "<code>MAX(TS_INCL_TRAN)<\/code>"], ["Atributo", "<code>TS_INCL_TRAN<\/code>"]], "notes": [], "explanation": ["Na mesma leitura da janela de sincronização, agrupa os registros por MCI e identifica a inclusão mais recente.", "A última inclusão é registrada para localizar o ciclo financeiro já fechado."], "stage": 0}, {"id": "regra-1-3", "name": "Identificação Agro", "kind": "Enriquecimento", "round": "agro", "source": "Consulta Agro", "title": "Agro é uma informação, não um filtro.", "body": "<p class=\"lead\">Consulta o indicador Agro pelo MCI e registra o valor encontrado.<\/p><div class=\"inline-values\"><code>FLAG_AGRO<\/code><span>true / false<\/span><\/div><p class=\"annotation\">O MCI segue na análise com qualquer um desses dois valores.<\/p>", "tech": [["Fonte", "<code>tabela_agro.flag_agro<\/code>"], ["Chave", "<code>CD_CLI<\/code>"], ["Atributo", "<code>FLAG_AGRO<\/code>"]], "notes": ["<strong>Indicador informativo<\/strong><p>A identificação Agro não é um filtro de elegibilidade.<\/p>"], "explanation": ["Consulta o indicador Agro pelo MCI.", "O valor encontrado é registrado. Tanto true quanto false permitem que o MCI siga na análise."], "stage": 0}, {"id": "regra-1-2", "name": "Identificação de pessoa física", "kind": "Elegibilidade", "round": "sync", "source": "Leitura de transações recentes", "title": "Somente clientes pessoa física seguem na análise.", "body": "<p class=\"lead\">O Radar verifica o tipo de pessoa nos dados.<\/p><div class=\"formula\"><span>Condição de elegibilidade<\/span><code>CD_TIP_PSS = 1<\/code><\/div>", "tech": [["Condição", "<code>CD_TIP_PSS = 1<\/code>"], ["Atributo", "<code>FLAG_PESSOA_FISICA<\/code>"]], "notes": [], "explanation": ["Verifica o tipo de pessoa nos dados.", "O MCI identificado como pessoa física passa por esta regra."], "stage": 0}, {"id": "regra-2-1", "name": "Conta corrente BB única", "kind": "Elegibilidade", "round": "sync", "source": "Leitura de transações recentes", "title": "É necessária exatamente uma conta corrente BB elegível.", "body": "<p class=\"lead\">Conta pares distintos e preenchidos de agência e conta da marca BB. O par único deve ser convertível para consultar o cadastro do ciclo.<\/p><div class=\"outcomes\"><div><span class=\"yes\">Segue<\/span><b>1 par válido e convertível<\/b><\/div><div><span class=\"no\">Não segue<\/span><b>0, múltiplos ou par incompatível<\/b><\/div><\/div><p class=\"warning-line\"><b>Pendente de validação:<\/b> confirmar se a contagem usa o produto 9 (cartão) ou apenas o produto 6 (conta corrente).<\/p>", "tech": [["Campos de origem", "<code>NR_AG_TITR<\/code> (agência) e <code>CD_CT_TITR<\/code> (conta)"], ["Marca BB", "<code>NR_MCA_PCT_OPB = 999999999<\/code>"], ["Filtro geral de produtos", "<code>CD_PRD IN (6, 9)<\/code>"], ["Tratamento", "Para todos os MCIs avaliados: remove espaços nas pontas, verifica se os valores contêm apenas dígitos e retira os zeros à esquerda do número da conta na conversão."], ["Campos de execução", "<code>CD_UOR_CC<\/code> e <code>NR_CC<\/code>"], ["Atributo", "<code>FLAG_CONTA_CORRENTE_BB_UNICA<\/code>"]], "notes": ["<strong>Pendente de validação<\/strong><p>Confirmar se o produto 9 (cartão) fornece um par de agência e conta para a contagem de contas BB únicas ou se essa contagem usa apenas o produto 6 (conta corrente).<\/p>"], "explanation": ["Conta os pares distintos e preenchidos de agência e conta para a marca BB. O par deve ser único e permitir conversão para consultar o cadastro do ciclo.", "Se o par único permanecer incompatível após o tratamento, a flag recebe false. O par convertido é mantido durante a execução para a consulta do dia do ciclo."], "stage": 1}, {"id": "regra-2-2", "name": "CPF único", "kind": "Elegibilidade", "round": "sync", "source": "Leitura de transações recentes", "title": "É necessário exatamente um CPF identificado.", "body": "<p class=\"lead\">Conta CPFs distintos preenchidos por MCI, excluindo valores nulos.<\/p><div class=\"outcomes\"><div><span class=\"yes\">Segue<\/span><b>1 CPF distinto<\/b><small>Usado na consulta de renda.<\/small><\/div><div><span class=\"no\">Não segue<\/span><b>0 ou múltiplos CPFs<\/b><small>CPF selecionado fica vazio.<\/small><\/div><\/div>", "tech": [["Campo de origem", "<code>NR_CPF_CNPJ_TITR<\/code>"], ["Tratamento", "Converte o CPF selecionado para o formato numérico usado na consulta, sem validar os dígitos verificadores."], ["Atributos", "<code>FLAG_CPF_UNICO<\/code> e <code>CPF_UNICO<\/code> (usado na consulta de renda)"]], "notes": [], "explanation": ["Conta os CPFs distintos preenchidos para cada MCI, excluindo valores nulos.", "Se houver exatamente um CPF, a flag recebe true e o número é usado na consulta de renda. Se houver zero ou mais de um, a flag recebe false e o CPF selecionado fica vazio."], "stage": 1}, {"id": "regra-2-3", "name": "Renda presumida", "kind": "Elegibilidade", "round": "income", "source": "Consulta de renda", "title": "Renda disponível aprova a regra, inclusive R$ 0.", "body": "<p class=\"lead\">Após pessoa física, conta BB única e CPF único, consulta a renda pelo CPF e usa o registro mais recente.<\/p><div class=\"formula\"><span>Renda presumida do período<\/span><b>Renda × quantidade de ciclos<\/b><\/div><p class=\"annotation\">Sem valor, o MCI não segue. Os percentuais de gasto são calculados somente quando a renda é positiva.<\/p>", "tech": [["Fonte", "<code>DB2DFE.REN_AVLD_PF<\/code>"], ["Chave", "<code>NR_CPF_BASE_SRF<\/code>"], ["Ordenação", "<code>DT_INCL_REN_AVLD<\/code> (registro mais recente)"], ["Cálculo", "<code>VL_REN<\/code> × quantidade de ciclos"], ["Atributos", "<code>FLAG_RENDA_PRESUMIDA_DISPONIVEL<\/code> e <code>VL_REN_PRES<\/code>"]], "notes": [], "explanation": ["A consulta em lote recebe apenas MCIs que passaram nas regras de pessoa física, conta BB única e CPF único. Busca a renda pelo CPF identificado e seleciona o registro mais recente.", "O valor da renda é multiplicado pela quantidade de ciclos. Um valor disponível, inclusive R$ 0, aprova a regra; os percentuais de gasto são calculados quando a renda é positiva."], "stage": 1}, {"id": "regra-2-4", "name": "Macroperfil financeiro", "kind": "Elegibilidade", "round": "profile", "source": "Consulta de macroperfil", "title": "O macroperfil mais recente deve ser identificável.", "body": "<p class=\"lead\">Após a regra de renda, consulta os últimos seis meses, incluindo a data de execução, e usa a ocorrência mais recente por MCI.<\/p><div class=\"outcomes\"><div><span class=\"yes\">Segue<\/span><b>Código identificado<\/b><small>Sem restringir seus valores.<\/small><\/div><div><span class=\"no\">Não segue<\/span><b>Sem registro ou códigos conflitantes<\/b><small>Na data mais recente; código fica vazio.<\/small><\/div><\/div>", "tech": [["Fonte", "<code>DB2D1D.DVS_GRDR_FNCO_PF<\/code>"], ["Condição", "<code>DT_EXEA − 6 meses ≤ DT_REF ≤ DT_EXEA<\/code>"], ["Atributos", "<code>FLAG_MACROPERFIL_VALIDO<\/code> e <code>CD_MAC_PRFL_CLI<\/code>"]], "notes": [], "explanation": ["A consulta em lote recebe MCIs que passaram na regra de renda. Limita a leitura aos últimos seis meses, incluindo a data da execução, e seleciona a ocorrência mais recente de cada MCI.", "A flag recebe true quando o perfil mais recente é identificado, sem restringir os valores do código. Sem registro, ou com códigos diferentes na data mais recente, recebe false, o código fica vazio e o lote segue com os outros clientes."], "stage": 1}, {"id": "regra-3-1", "name": "Identificação do dia do ciclo", "kind": "Definição de período", "round": "cycle", "source": "Cadastro do ciclo", "title": "O dia cadastrado é a referência; na ausência, usa-se o dia 1.", "body": "<p class=\"lead\">Consulta o registro mais recente da conta, em lote, somente após todas as flags de elegibilidade em true.<\/p><div class=\"outcomes neutral\"><div><span>Cadastro informa o dia<\/span><b>Salva e usa o dia encontrado<\/b><\/div><div><span>Conta consultável, sem dia<\/span><b>Usa dia 1<\/b><small>O atributo cadastral fica vazio.<\/small><\/div><\/div>", "tech": [["Fonte", "<code>DB2GFP.CT_GRDR_FNCO<\/code>"], ["Chaves", "<code>CD_UOR_CC<\/code> e <code>NR_CC<\/code>"], ["Ordenação", "<code>TS_ULT_EXEA_PSQ<\/code> (registro mais recente)"], ["Atributo", "<code>DD_INC_MM_CLC_BLC<\/code>"]], "notes": [], "explanation": ["Após a avaliação de renda e macroperfil, consulta em lote apenas MCIs com todas as flags de elegibilidade em true. Localiza a conta pela agência e número e obtém o dia de início do ciclo do registro mais recente.", "O dia cadastrado é salvo e usado no cálculo do período. Se a conta for consultável, mas o cadastro não informar o dia, a coluna fica vazia e o cálculo usa o dia 1."], "stage": 1}, {"id": "regra-3-2", "name": "Período financeiro fechado", "kind": "Definição de período", "round": "period", "source": "Cálculo do período", "title": "O Radar analisa apenas ciclos financeiros fechados.", "body": "<p class=\"lead\">O dia financeiro indica em que dia do mês o ciclo começa. Cada ciclo termina na véspera da abertura seguinte. O Radar escolhe o ciclo mais recente que terminou até a data da última sincronização. Se o cliente sincronizou no último dia, esse ciclo já conta.<\/p><p class=\"annotation\"><b>Exemplo com um ciclo de análise.<\/b> O Radar roda em <b>26/11/2026<\/b>. Para passar na regra de entrada, a sincronização deve ocorrer entre <b>01/10 e 25/11<\/b>. O cliente sincronizou em <b>26/10<\/b> e seu dia financeiro é <b>28<\/b>.<\/p><div class=\"timeline cycle\"><div class=\"time muted\"><b>Ciclo de 28/09 a 27/10<\/b><span>Quando o cliente sincronizou em 26/10, faltava um dia para o ciclo fechar.<\/span><\/div><div class=\"time active-time\"><b>Ciclo de 28/08 a 27/09<\/b><span>O Radar seleciona esse período porque é o ciclo anterior e já estava fechado.<\/span><\/div><\/div><p class=\"annotation\">Se o cliente tivesse sincronizado em 27/10, o último dia já contaria e o Radar selecionaria o ciclo de 28/09 a 27/10.<\/p><p class=\"annotation\">Quando falta o dia financeiro, o Radar usa o dia 1. Se o mês for mais curto, a abertura cai no último dia do mês. Para analisar mais de um ciclo, o início do período recua.<\/p>", "tech": [["Entradas", "<code>DD_INC_MM_CLC_BLC<\/code> (dia financeiro, com tratamento descrito na etapa 2) e <code>TS_INCL_TRAN<\/code>"], ["Atributos", "<code>DT_REF_INI<\/code> e <code>DT_REF_FIM<\/code>"]], "notes": [], "explanation": ["O dia financeiro marca a abertura do ciclo, que termina na véspera da abertura seguinte. O Radar usa o ciclo mais recente cujo fim é igual ou anterior à data da última sincronização.", "Na execução de 26/11/2026, a janela de sincronização vai de 01/10 a 25/11. O cliente sincronizou em 26/10 e seu dia financeiro é 28. Como o ciclo de 28/09 a 27/10 ainda estava aberto na data da sincronização, o Radar seleciona o ciclo anterior, de 28/08 a 27/09. Uma sincronização em 27/10 já levaria à seleção do ciclo de 28/09 a 27/10.", "O cálculo usa o dia 1 quando falta o dia financeiro e limita a abertura ao último dia de meses mais curtos. Se a análise incluir mais de um ciclo, o início recua. As datas inicial e final delimitam a seleção de transações."], "stage": 2}, {"id": "regra-3-3", "name": "Ciclo atualizado", "kind": "Elegibilidade", "round": "period", "source": "Fim do ciclo e data da execução", "title": "O ciclo fechado deve ser recente para entrar na avaliação.", "body": "<p class=\"lead\">Depois de calcular o último ciclo fechado, o Radar verifica o mês e o ano em que ele terminou. O ciclo está atualizado se terminou no mês da execução ou no mês anterior.<\/p><p class=\"annotation\"><b>Exemplo.<\/b> Para a execução de <b>26/11/2026<\/b>, valem ciclos encerrados em <b>outubro ou novembro de 2026<\/b>.<\/p><div class=\"outcomes\"><div><span class=\"yes\">Ciclo atualizado<\/span><b>28/09 a 27/10<\/b><small>Terminou em outubro. A flag recebe <code>'true'<\/code>.<\/small><\/div><div><span class=\"no\">Ciclo antigo<\/span><b>28/08 a 27/09<\/b><small>Terminou em setembro. A flag recebe <code>'false'<\/code>.<\/small><\/div><\/div><p class=\"annotation\">O cliente com ciclo antigo fica na tabela principal e fica fora da avaliação. Quando o período fica sem cálculo, a flag fica <code>NULL<\/code>.<\/p>", "tech": [["Condição", "O mês e o ano de <code>DT_REF_FIM<\/code> correspondem ao mês de <code>DT_EXEA<\/code> ou ao mês anterior."], ["Atributo", "<code>FLAG_CICLO_ATUALIZADO<\/code>"], ["Participação final", "Exige ciclo atualizado e aprovação nas demais regras de elegibilidade."]], "notes": [], "explanation": ["O Radar compara o mês e o ano do fim do ciclo fechado com o mês e o ano da execução.", "Se o fim do ciclo está no mês da execução ou no mês anterior, a flag recebe true. Se está em outro mês, recebe false. Sem período calculado, a flag fica nula."], "stage": 2}, {"id": "regra-4-1", "name": "Transação efetivada", "kind": "Seleção de transações", "round": "", "source": "", "title": "Somente transações efetivadas seguem na seleção.", "body": "<p class=\"lead\">O Radar aplica o recorte de produtos e verifica o estado de cada transação. Débitos do ciclo também devem estar visíveis ao consumidor.<\/p><div class=\"criteria\"><div><span>Produtos<\/span><code>CD_PRD IN (6, 9)<\/code><\/div><div><span>Estado efetivado<\/span><code>CD_EST_TRAN_INST = 0<\/code><\/div><div><span>Visibilidade dos débitos<\/span><code>IN_VSLO_CSM = 'S'<\/code><\/div><\/div>", "tech": [["Produtos", "<code>CD_PRD IN (6, 9)<\/code>"], ["Estado efetivado", "<code>CD_EST_TRAN_INST = 0<\/code>"], ["Vi
